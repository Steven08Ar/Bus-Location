version: '3.8'

services:
  backend:
    build: .
    container_name: bus-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=1234
      - DB_NAME=unibus
      - MQTT_URL=mqtt://mqtt:1883
      - MAPBOX_TOKEN=${MAPBOX_TOKEN}
      - NODE_ENV=production
    depends_on:
      - db
      - mqtt

  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_DB=unibus
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=1234
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  mqtt:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"

volumes:
  db_data:
