version: '3.8'

networks:
  backend-net:
    driver: bridge

volumes:
  db_data:
  mosquitto_data:
  mosquitto_logs:


services:
  backend:
    build: .
    container_name: bus-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      mqtt:
        condition: service_healthy
    environment:
      NODE_ENV: production
      APP_PORT: 3000
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: 1234
      DB_NAME: unibus
      MQTT_URL: mqtt://mqtt:1883
      MAPBOX_TOKEN: ${MAPBOX_TOKEN}
    ports:
      - "3000:3000"
    networks:
      - backend-net

  db:
    image: postgres:15-alpine
    container_name: bus-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: unibus
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d unibus" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - backend-net

  mqtt:
    image: eclipse-mosquitto:2
    container_name: bus-mqtt
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - mosquitto_data:/mosquitto/data
      - mosquitto_logs:/mosquitto/log
    healthcheck:
      test: [ "CMD-SHELL", "mosquitto_pub -h localhost -t 'health/check' -m 'ok' || exit 1" ]
      interval: 5s
      timeout: 5s
      retries: 3
    networks:
      - backend-net

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: bus-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend-net
